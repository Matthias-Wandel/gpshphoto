            position: absolute; top: 10px; right: 10px; width: 320px;
            background: rgba(255, 255, 255, 0.95); padding: 12px;
            border-radius: 8px; display: none;
            pointer-events: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); border: 1px solid #ccc;
            z-index: 1000;
        }
        #preview-img { width: 320px; height: 240px; object-fit: contain; background: #111; border-radius: 4px; cursor: pointer; }
        #info-text { margin-top: 10px; font-size: 13px; color: #111; line-height: 1.5; white-space: pre-wrap; }
        .link-text { cursor: pointer; color: #0056b3; text-decoration: underline; padding: 2px 0; display: inline-block; }
    </style>
</head>
<body>

<div id="ui-overlay">
    <img id="preview-img" alt="Preview">
    <div id="info-text"></div>
</div>


<a id="map-link" target="_blank" style="
    position: absolute; top: 18px; left: 0;
    background: #00a000; color: white;
    padding: 2px 8px; border-radius: 2px;
    text-decoration: none; font-family: sans-serif;
    font-size: 14px; border: 1px solid white;

<canvas id="mapCanvas"></canvas>

<script>
const canvas = document.getElementById('mapCanvas');
const ctx = canvas.getContext('2d');
const uiOverlay = document.getElementById('ui-overlay');
const previewImg = document.getElementById('preview-img');
const infoText = document.getElementById('info-text');

let images = [];
let visibleImages = [];
let clusters = [];
let selectedImage = null;
let currentPreview = null;

function getInitialView() {

    let lat = 45.624897, lon = -75.239783, latHeight = 7; // Fallback location.

    const searchString = window.location.search;
    const match = searchString.match(/@([\d.-]+),([\d.-]+)(?:,([\d.]+)([mz]))?/);

    if (match) {
        lat = parseFloat(match[1]);
        lon = parseFloat(match[2]);
        const val = parseFloat(match[3]);
        const unit = match[4];

        if (unit === 'z') {
            // Google zoom 0 = 180 degrees of latitude height
            latHeight = 180 / Math.pow(2, val);
        } else {
            // Unit 'm' is vertical meters. 1 degree lat is ~111,120 meters.
            latHeight = (val || 100000) / 111120;
        }
    } else {
        const saved = JSON.parse(localStorage.getItem('mapView'));

        if (saved && saved.lat) {
            lat = saved.lat; lon = saved.lon; latHeight = saved.latHeight;
        }
    }
    return { lat, lon, latHeight };
}

let view = {
    ...getInitialView(),
    dragging: false,
    dragStart: { x: 0, y: 0 },
    dragOffset: { x: 0, y: 0 },
    pinchInitialDist: 0,
    pinchScale: 1.0,
    pinchCenter: { x: 0, y: 0 },
    pinchStartCenter: { x: 0, y: 0 }
};

updateLatScale(view.latHeight)


function saveView() {
    // Scale is simple: total vertical meters
    const heightInMeters = Math.round(view.latHeight * 111120);

    localStorage.setItem('mapView', JSON.stringify({
        lat: view.lat,
        lon: view.lon,
        latHeight: view.latHeight
    }));

    // Update the 'MAP' URL
    let locValue = `@${view.lat.toFixed(6)},${view.lon.toFixed(6)},${heightInMeters}m`;
    const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname +"?"+ locValue;
    history.replaceState(null, '', newUrl);

    // Update the physical <a> tag
    const mapLink = document.getElementById('map-link');
    if (mapLink) {
        mapLink.href = `https://www.google.com/maps/${locValue}`;
    }
}

// --- DATA LOADING ---
function initData() {
    baseMap.init(); // Load basemaps
    // Alert the user if gpstagged.js (containing rawImageData) is missing
    if (typeof rawImageData !== 'undefined') {
        parseData(rawImageData);
        updateVisibleData();
    } else {
        alert("gpstagged.js not found or rawImageData not created.");
    }
}

function parseData(text) {
    const lines = text.trim().split(/\r?\n/);
    images = [];
    for (let i = 0; i < lines.length; i++) {
        let path = lines[i].trim();
        // Skip JS wrapper lines if they are included in the string
        if (!path || path.startsWith("const") || path.endsWith("`;")) continue;
        let dtl = (lines[++i] || "").replace('Date/Time: ', '').trim();
        let gl = (lines[++i] || "");
        let cl = (lines[++i] || "").replace('Camera: ', '').trim();
        const m = gl.match(/GPS:\s*([\d.-]+),\s*([\d.-]+)/);
        if (m) images.push({ path, dateTime: dtl, lat: parseFloat(m[1]), lon: parseFloat(m[2]), camera: cl || "Unknown",hl:0 });
    }
    images.sort((a, b) => a.lon - b.lon || a.lat - b.lat || a.camera > b.camera || a.dateTime > b.dateTime);
    //hilightSuspectCoordinates();
}

// --- COORDINATE TRANSFORMATIONS ---
// Converts a geographic Latitude into a normalized Mercator Y value (0.0 to 1.0)
function lat2mercatorY(lat) {
    const rad = lat * Math.PI / 180;
    return (1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2;
}

// Converts a normalized Mercator Y value back into a geographic Latitude
function mercatorY2lat(y)
{
    const n = Math.PI - 2 * Math.PI * y;
    return 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
}

function latLon2xy(lat, lon)
{
    const centerMercatorY = lat2mercatorY(view.lat);

    // Scale horizontal longitude linearly
    const x = canvas.width / 2 + (lon - view.lon) * view.lonScale;

    // Position vertical pixels using the Mercator logarithmic curve
    const targetMercatorY = lat2mercatorY(lat);
    const mercatorDeltaY = targetMercatorY - centerMercatorY;
    const pixelScaleY = canvas.height / view.yHeight;
    const y = canvas.height / 2 + (mercatorDeltaY * pixelScaleY);

    return { x, y };
}

function xy2latLon(x, y)
{
    // Reverse longitude mapping
    const lon = view.lon + (x - canvas.width / 2) / view.lonScale;

    // Reverse Mercator Y curve back to actual latitude degrees
    const centerMercatorY = lat2mercatorY(view.lat);
    const pixelScaleY = canvas.height / view.yHeight;
    const targetMercatorY = centerMercatorY + (y - canvas.height / 2) / pixelScaleY;
    const lat = mercatorY2lat(targetMercatorY);

    return { lat, lon };
}

function updateLatScale(newLatHeight)
{
    // 1. Establish the current Mercator height footprint
    view.latHeight = newLatHeight;
    const topLat = view.lat + (newLatHeight / 2);
    const bottomLat = view.lat - (newLatHeight / 2);


    view.yHeight = lat2mercatorY(bottomLat) - lat2mercatorY(topLat);

    // 2. Synchronize the horizontal pixels-per-degree multiplier
    // At Web Mercator scale, the full world width matches the full world height
    const totalWorldPixelHeight = canvas.height / view.yHeight;
    view.lonScale = totalWorldPixelHeight / 360;
}

// Object for cronologically going through visbleImages using cursor keys
const chronological = {
    cronoIndexArray: null,

    clear() {
        this.cronoIndexArray = null;
    },

    getNavIndex(currentIndex, action) {
        if (visibleImages.length === 0) return null;

        if (!this.cronoIndexArray) {
            this.cronoIndexArray = Array.from(visibleImages.keys());
            this.cronoIndexArray.sort((a, b) => {
                const dateA = visibleImages[a].dateTime;
                const dateB = visibleImages[b].dateTime;
                return dateA < dateB ? -1 : (dateA > dateB ? 1 : 0);
            });
        }

        // Absolute navigation works even if currentIndex is -1
        if (action === "first") return this.cronoIndexArray[0];
        if (action === "last") return this.cronoIndexArray[this.cronoIndexArray.length - 1];

        // Relative navigation (Arrows) requires an existing selection
        if (currentIndex === -1) return null;

        const currentPos = this.cronoIndexArray.indexOf(currentIndex);
        if (currentPos === -1) return null;

        let nextPos = currentPos + action;
        if (nextPos < 0) nextPos = 0;
        if (nextPos >= this.cronoIndexArray.length) nextPos = this.cronoIndexArray.length - 1;

        return this.cronoIndexArray[nextPos];
    }
};

// Object for drawing OpenStreetMap tiles dynamically on the background
const baseMap = {
    tileCache: new Map(),

    init() {
        console.log("OpenStreetMap provider initialized.");
    },

    // Standard cryptographic/mathematical hash helper to map Lat/Lon to OSM tile grids
    lon2tile(lon, zoom) {
        return Math.floor((lon + 180) / 360 * Math.pow(2, zoom));
    },

    lat2tile(lat, zoom) {
        return Math.floor((1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * Math.pow(2, zoom));
    },

    // Reverse calculation to position tiles correctly on screen relative to your linear map grid
    tile2lon(x, z) {
        return x / Math.pow(2, z) * 360 - 180;
    },

    tile2lat(y, z) {
        const n = Math.PI - 2 * Math.PI * y / Math.pow(2, z);
        return 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
    },

draw() {
        let zoom = Math.round(Math.log2(180 / view.latHeight));
        if (zoom < 0) zoom = 0;
        if (zoom > 19) zoom = 19;

        const topLeftGeo = xy2latLon(0, 0);
        const bottomRightGeo = xy2latLon(canvas.width, canvas.height);

        const minTileX = this.lon2tile(topLeftGeo.lon, zoom);
        const maxTileX = this.lon2tile(bottomRightGeo.lon, zoom);
        const minTileY = this.lat2tile(topLeftGeo.lat, zoom);
        const maxTileY = this.lat2tile(bottomRightGeo.lat, zoom);

        ctx.save();

        // Maps input range 179-255 onto output range 0-142
        // Dim the bright values into a low range first, then expand the contrast pivot point
        ctx.filter = 'brightness(40%) contrast(250%) brightness(180%)';

        for (let x = minTileX; x <= maxTileX; x++) {
            for (let y = minTileY; y <= maxTileY; y++) {
                const tileKey = `${zoom},${x},${y}`;
                let img = this.tileCache.get(tileKey);

                if (!img) {
                    img = new Image();
                    img.crossOrigin = "Anonymous";
                    // Using the light map as the foundation
                    // Replace the old osm tile source line with this one:
                    img.src = `https://basemaps.cartocdn.com/rastertiles/voyager/${zoom}/${x}/${y}.png`;

                    img.addEventListener('load', () => { draw(); }, { once: true });
                    this.tileCache.set(tileKey, img);
                }

                if (img.complete && img.naturalWidth !== 0) {
                    const tileMaxLat = this.tile2lat(y, zoom);
                    const tileMinLat = this.tile2lat(y + 1, zoom);
                    const tileMinLon = this.tile2lon(x, zoom);
                    const tileMaxLon = this.tile2lon(x + 1, zoom);

                    const screenTopLeft = latLon2xy(tileMaxLat, tileMinLon);
                    const screenBottomRight = latLon2xy(tileMinLat, tileMaxLon);

                    const tileW = screenBottomRight.x - screenTopLeft.x;
                    const tileH = screenBottomRight.y - screenTopLeft.y;

                    ctx.drawImage(img, screenTopLeft.x, screenTopLeft.y, tileW, tileH);
                }
            }
        }

        ctx.restore(); // Restores context to full fidelity for UI overlays and data dots
    }};



// --- DRAWING & CLUSTERING ---
function updateVisibleData() {
    updateLatScale(view.latHeight)
    saveView();
    chronological.clear(); // Clear the chronological cache
    if (images.length === 0) return;
    const b1 = xy2latLon(-20, -20);
    const b2 = xy2latLon(canvas.width + 20, canvas.height + 20);

    const maxLat = b1.lat;
    const minLat = b2.lat;
    const minLon = b1.lon;
    const maxLon = b2.lon;

    // Binary search for image of nearest longitude
    function findFirstLongitudeIndex(targetLon) {
        let low = 0, high = images.length;
        while (low < high) {
            let mid = (low + high) >>> 1;
            if (images[mid].lon < targetLon) low = mid + 1;
            else high = mid;
        }
        return low;
    }

    // Longitude range to filter by
    const startIndex = findFirstLongitudeIndex(minLon);
    let endIndex = findFirstLongitudeIndex(maxLon);
    if (endIndex < images.length) endIndex += 1;

    visibleImages = [];
    for (let i = startIndex; i < endIndex; i++) {
        const img = images[i];
        // Filter by Latutude (already have looping over right longitude range)
        if (img.lat >= minLat && img.lat <= maxLat) {
            visibleImages.push(img);
        }
    }
    //console.log(`Slice: ${endIndex - startIndex} show: ${visibleImages.length}`);

    const latRad = view.lat * Math.PI / 180;
    const pixelsPerMeter = canvas.height / (view.latHeight * 111120);

    const useJitter = pixelsPerMeter > 60;

    for (let i = 0; i < visibleImages.length; i++) {
        const img = visibleImages[i];
        const screenPos = latLon2xy(img.lat, img.lon);

        if (useJitter) {
            // Look ahead to find how many images share this exact coordinate
            let j = i + 1;
            while (j < visibleImages.length &&
                visibleImages[j].lat === img.lat && visibleImages[j].lon === img.lon) j++;

            let count = j - i;
            if (count > 1){
                if (count > 11) { // Sprial for 11+ points
                    let spacing = pixelsPerMeter * 0.03
                    for (k=0; k < count; k++) {
                        const groupImg = visibleImages[i + k];

                        let rad = Math.sqrt(k + 1.5);
                        let theta = 4 * rad;
                        groupImg.x = screenPos.x + Math.cos(theta) * rad * spacing;
                        groupImg.y = screenPos.y + Math.sin(theta) * rad * spacing;
                    }
                }else{ // Evenly space images around a for 2-10 points
                    let radius = pixelsPerMeter * 0.1;
                    if (count >=6) count -= 1; // Don't offset last image so it falls in circle center
                    for (k=0; k < count; k++) {
                        const groupImg = visibleImages[i + k];
                        let angle = ((k+0.5) / count) * Math.PI * 2;
                        groupImg.x = screenPos.x + Math.cos(angle) * radius;
                        groupImg.y = screenPos.y + Math.sin(angle) * radius;
                    }
                }
                i += count-1; // Skip the rest of the group in the outer loop
                continue;
            }
        }
        // Single point in location, or not using jitter.
        img.x = screenPos.x;
        img.y = screenPos.y;
    }

    if (useJitter){
        // Longitude sorted source data produces x-sorted data
        // but if we added x-y jitter, re-sorting is needed.
        visibleImages.sort((a, b) => a.x - b.x);
    }

    clusters = [];
    const baseRadius = 3;
    visibleImages.forEach(img => {
        let merged = false;

        if (!useJitter) { // Only cluster if we aren't zoomed in enough to use jitter
            for (let i = clusters.length - 1; i >= 0; i--) {
                const c = clusters[i];
                if (img.x - c.x > 50){
                    // Clusters end up naturally longitude sorted.  Looking further left
                    // won't find a cluster to combine with
                    break;
                }
                const d = Math.sqrt((img.x - c.x) ** 2 + (img.y - c.y) ** 2);
                if (d < c.radius*1.1) {
                    const w = c.count + 1;
                    c.x = (c.x * c.count + img.x) / w;
                    c.y = (c.y * c.count + img.y) / w;

                    c.count++;
                    c.radius = c.count > 3 ? baseRadius * Math.pow(c.count / 3, 1/3) : baseRadius;
                    c.hl += img.hl;
                    merged = true;
                    break;
                }
            }
        }

        if (!merged) {
            clusters.push({ x: img.x, y: img.y, count: 1, hl: img.hl, radius: baseRadius });
        }
    });

    // If a cluster has grown large enough, it might have swallowed previous clusters to its left
    // that were created before the cluster grew that big.  Iterate right to left
    // to see if large clusters swallow smaller older clusters to the left.
    if (!useJitter) {
        for (let i = clusters.length - 1; i >= 0; i--) {
            const cMain = clusters[i];
            if (cMain.count <= 3) continue; // Radius doesn't increase before 3, so would not have swallowed.

            // Check clusters to the left of cMain
            for (let j = i - 1; j >= 0; j--) {
                const cLeft = clusters[j];

                // Since they are longitude sorted, if the X distance is
                // greater than the combined radii, we can stop looking left.
                if (cMain.x - cLeft.x > (cMain.radius + cLeft.radius) * 1.5) break;

                const d = Math.sqrt((cMain.x - cLeft.x)**2 + (cMain.y - cLeft.y)**2);

                // If they overlap (using a 1.1x multiplier for a cleaner look)
                if (d < (cMain.radius + cLeft.radius) * 0.8) {
                    const totalCount = cMain.count + cLeft.count;

                    // Merge positions in Screen Space
                    cMain.x = (cMain.x * cMain.count + cLeft.x * cLeft.count) / totalCount;
                    cMain.y = (cMain.y * cMain.count + cLeft.y * cLeft.count) / totalCount;

                    cMain.count = totalCount;

                    cMain.hl += cLeft.hl;

                    // Recalculate radius based on new count
                    cMain.radius = cMain.count > 3 ? baseRadius * Math.pow(cMain.count / 3, 1/3) : baseRadius;

                    clusters.splice(j, 1); // Remove the merged cluster from the left

                    i--;  // Adjust 'i' because the array just got shorter
                }
            }
        }
    }
    draw();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();

    ctx.translate(view.dragOffset.x, view.dragOffset.y);

    if (view.pinchScale !== 1.0) { // Scaling relative to the original pinch center
        ctx.translate(view.pinchStartCenter.x, view.pinchStartCenter.y);
        ctx.scale(view.pinchScale, view.pinchScale);
        ctx.translate(-view.pinchStartCenter.x, -view.pinchStartCenter.y);
    }

    baseMap.draw()

    // Draw image points & clusters
    ctx.globalCompositeOperation = 'lighter';
    clusters.forEach(c => {
        if (c.hl)
            ctx.fillStyle = `rgba(255, 255, 144, 1)`;
        else {
            if (c.count == 1){
                ctx.fillStyle = `rgba(60, 140, 255, 0.6)`;
            }else if (c.count == 2){
                ctx.fillStyle = `rgba(60, 150, 255, 0.85)`;
            }else{
                ctx.fillStyle = `rgba(60, 180, 255, 1)`;
            }
        }
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
        ctx.fill();
    });

    if (currentPreview) {
        ctx.globalCompositeOperation = 'source-over';
        if (currentPreview === selectedImage) {
            ctx.strokeStyle = 'red'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(currentPreview.x, currentPreview.y, 9, 0, Math.PI * 2); ctx.stroke();
        }
        ctx.fillStyle = 'red'; ctx.beginPath(); ctx.arc(currentPreview.x, currentPreview.y, 3, 0, Math.PI * 2); ctx.fill();
    }

    ctx.restore();
    drawScaleBar(visibleImages.length);
}


function findNearestImage(x, y, threshold) {
    if (visibleImages.length === 0) return null;

    // binary search to find the index closest to the target X coordinate as starting point
    let low = 0;
    let high = visibleImages.length;
    while (low < high) {
        let mid = (low + high) >>> 1;
        if (visibleImages[mid].x < x) low = mid + 1;
        else high = mid;
    }
    const startIndex = low;

    let nearest = null, minDist = threshold;
    let indices = [startIndex - 1, startIndex];
    let done = [false, false];

    while (!done[0] || !done[1]) {
        for (let i = 0; i < 2; i++) {
            if (done[i]) continue;
            const idx = indices[i];
            if (idx < 0 || idx >= visibleImages.length) { done[i] = true; continue; }

            const img = visibleImages[idx];
            // Use cached screen coordinates

            // Horizontal distance check (early exit for sorted list)
            if (Math.abs(img.x - x) > minDist) {
                done[i] = true;
                continue;
            }
            // First check bounding box
            if (Math.abs(img.y - y) < minDist) {
                // Full Euclidean distance check
                const d = Math.sqrt((img.x - x) ** 2 + (img.y - y) ** 2);
                if (d < minDist) {
                    minDist = d;
                    nearest = img;
                }
            }
            // Update index: i=0 moves left (-1), i=1 moves right (+1)
            indices[i] += (i === 0 ? -1 : 1);
        }
    }
    return nearest;
}

// Global to store the map button bounds and current view width
let mapButtonRect = { x: 0, y: 0, w: 0, h: 0 };
let currentWidthMeters = 1000;

function drawScaleBar(count) {
    const metersPerDegreeLat = 111132;
    // pixels per degree / meters per degree
    const metersPerPixel = view.latHeight * metersPerDegreeLat / canvas.height;

    const maxBarWidth = 300;
    const maxMeters = maxBarWidth * metersPerPixel;
    const steps = [1, 2, 5];
    let mag = Math.pow(10, Math.floor(Math.log10(maxMeters)));
    let bestMeters = 0;
    for (let i = 2; i >= 0; i--) {
        let test = steps[i] * mag;
        if (test <= maxMeters) { bestMeters = test; break; }
    }
    if (bestMeters === 0) bestMeters = mag / 2;
    const barWidth = bestMeters / metersPerPixel;
    const label = bestMeters >= 1000 ? (bestMeters / 1000) + " km" : bestMeters + " m";

    const x = 20, y = 30;
    ctx.save(); ctx.resetTransform();

    // Draw Scale Line
    ctx.strokeStyle = "white"; ctx.fillStyle = "white"; ctx.lineWidth = 2; ctx.font = "bold 14px sans-serif";
    ctx.beginPath(); ctx.moveTo(x, y-5); ctx.lineTo(x, y+5); ctx.moveTo(x, y); ctx.lineTo(x+barWidth, y); ctx.moveTo(x+barWidth, y-5); ctx.lineTo(x+barWidth, y+5); ctx.stroke();
    ctx.textAlign = "center"; ctx.fillText(label, x + (barWidth / 2), y - 10);
    ctx.textAlign = "left"; ctx.font = "13px sans-serif"; ctx.fillText(`in view: ${count.toLocaleString()} images`, x, y + 25);

    // Position the HTML anchor tag dynamically
    const mapLink = document.getElementById('map-link');

    if (mapLink) {
        mapLink.style.left = (x + barWidth + 20) + "px";
        mapLink.style.display = 'block'; // Show it once calculated
    }

    ctx.restore();
}
function getThumbPath(fullPath) {
    let p = fullPath.replace(/\\/g, '/');
    let parts = p.split('/');
    let fn = parts.pop();
    return parts.length > 0 ? `${parts.join('/')}/_small/${fn}` : `_small/${fn}`;
}

function updateOverlay(img) {
    if (!img) return;
    // If already showing this, do nothing (prevents blinking if image doesn't exist)
    if (currentPreview === img) return;

    currentPreview = img;

    // Ensure the overlay is visible immediately
    uiOverlay.style.display = 'block';

    // If image fails to load, replace it with a blank image, so browser doesn't make the space dissapear.
    previewImg.onerror = () => {
        // Replace broken src with a transparent 1x1 pixel.
        // This keeps the 320x240 box filled with the #111 background color.
        previewImg.src = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
        previewImg.onerror = null;
    };

    previewImg.src = getThumbPath(img.path);
    infoText.innerHTML = '';
    const addLink = (txt, action) => {
        const s = document.createElement('div');
        s.className = 'link-text';
        s.textContent = txt;
        s.onclick = e => { e.stopPropagation(); action(); };
        s.ontouchend = e => { e.stopPropagation(); e.preventDefault(); action(); };
        infoText.appendChild(s);
    };
    addLink(img.path, () => {
        const p = img.path.replace(/\\/g, '/');
        window.open(p.substring(0, p.lastIndexOf('/')) + '/index.html', '_blank');
    });
    infoText.appendChild(document.createTextNode(`\n${img.dateTime}\n`));
    addLink(`GPS: ${img.lat.toFixed(6)}, ${img.lon.toFixed(6)}`, () => {
        window.open(`https://www.google.com/maps?q=${img.lat},${img.lon}`, '_blank');
    });
    infoText.appendChild(document.createTextNode(`\nCamera: ${img.camera}`));
}


// Prevent default to allow drop
window.addEventListener('dragover', e => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
});

window.addEventListener('drop', e => {
    e.preventDefault();
    const droppedData = e.dataTransfer.getData('text/plain');
    const match = droppedData.match(/@([\d.-]+),([\d.-]+)(?:,([\d.]+)([mz]))?/);
    if (!match) return;

    view.lat = parseFloat(match[1]);
    view.lon = parseFloat(match[2]);
    const val = parseFloat(match[3]);
    const unit = match[4];

    if (unit === 'm') {
        // View height in meters, used for google satellite view.
        updateLatScale(val / 111120);
    } else if (unit === 'z') {
        // Z-scale is relative to pixels.
        // Formula: (Total Degrees * Window Pixels) / (Base Tile Pixels * 2^Zoom)
        updateLatScale( (180 * canvas.height) / (256 * Math.pow(2, val)) );
    }
    updateVisibleData();
});

const handleStart = (x, y, isTouch) => {
    const r = uiOverlay.getBoundingClientRect();
    if (uiOverlay.style.display !== 'none' && x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return;

    const target = findNearestImage(x, y, isTouch ? 30 : 10);

    if (target) {
        selectedImage = target;
        updateOverlay(target);
        view.dragging = false;
    } else {
        selectedImage = null;
        view.dragging = true;
        view.dragStart = { x, y };
        uiOverlay.style.display = 'none';
    }
    draw(); // Redraw to clear the red selection circle
};
const handleMove = (x, y, isTouch) => {
    if (view.dragging) {
        view.dragOffset.x = x - view.dragStart.x;
        view.dragOffset.y = y - view.dragStart.y;
        draw();
    } else {
        const wasCurrent = currentPreview;
        // Search the already-filtered visible list for hovering
        const target = findNearestImage(x, y, isTouch ? 30 : 10);
        if (target) {
            updateOverlay(target);
        } else if (selectedImage) {
            // Snap back to selected image if not hovering anything else
            updateOverlay(selectedImage);
        }
        if (wasCurrent != currentPreview) draw()
    }
};


const finalizeInteraction = () => {
    if (view.pinchScale !== 1.0) {
        // Commit Pinch/Pan combination
        const b = xy2latLon(view.pinchStartCenter.x, view.pinchStartCenter.y);

        // Update scale
        let newlatHeight = view.latHeight / view.pinchScale;
        if (newlatHeight < 0.00005) newlatHeight = 0.00005;
        updateLatScale(newlatHeight);

        // Update center coordinates accounting for both zoom pivot and lateral drag
        // We look at the final position of our pivot point on the screen
        const finalScreenX = view.pinchStartCenter.x + view.dragOffset.x;
        const finalScreenY = view.pinchStartCenter.y + view.dragOffset.y;

        const a = xy2latLon(finalScreenX, finalScreenY);
        view.lon += (b.lon - a.lon);
        view.lat += (b.lat - a.lat);
    }else if (view.dragOffset.x !== 0 || view.dragOffset.y !== 0) {
        // Commit standard single-finger Drag
        const tempViewLatScale = view.lonScale * 2 * Math.cos(view.lat * Math.PI / 180);
        view.lon -= (view.dragOffset.x / view.lonScale);
        view.lat += (view.dragOffset.y / tempViewLatScale);
    }

    // Reset interaction states
    view.pinchScale = 1.0;
    view.dragOffset = { x: 0, y: 0 };
    view.dragging = false;
    view.pinchInitialDist = 0;

    updateVisibleData();
    saveView(); // Save the new committed state to URL/LocalStorage
};


canvas.addEventListener('touchstart', e => {
    // Finish any existing motion before starting a new one
    if (view.dragging || view.pinchScale !== 1.0) finalizeInteraction();

    if (e.touches.length === 1) {
        handleStart(e.touches[0].clientX, e.touches[0].clientY, true);
    } else if (e.touches.length === 2) {
        // Switch to pinch mode
        view.pinchInitialDist =
            Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                       e.touches[0].clientY - e.touches[1].clientY);

        view.pinchStartCenter = {
            x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
            y: (e.touches[0].clientY + e.touches[1].clientY) / 2
        };
        view.pinchCenter = { ...view.pinchStartCenter };
    }
}, { passive: false });


canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (e.touches.length === 1) {
        // Just a lateral drag.
        handleMove(e.touches[0].clientX, e.touches[0].clientY, true);

    } else if (e.touches.length === 2) {
        // Drag and zoom via pinch in and out.
        const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);

        // Update live scale
        view.pinchScale = dist / view.pinchInitialDist;

        // Update the current midpoint
        view.pinchCenter = {
            x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
            y: (e.touches[0].clientY + e.touches[1].clientY) / 2
        };

        // Calculate the movement of the fingers' midpoint
        // This allows zoom and pan simultaneously
        view.dragOffset.x = view.pinchCenter.x - view.pinchStartCenter.x;
        view.dragOffset.y = view.pinchCenter.y - view.pinchStartCenter.y;

        draw();
    }
}, {passive: false});

canvas.addEventListener('touchend', e => {
    finalizeInteraction();
    if (e.touches.length === 1) {
        // If one finger is still down, immediately start a new pan context
        // so the remaining finger can continue moving the map.
        handleStart(e.touches[0].clientX, e.touches[0].clientY, true);
    }
}, { passive: false });


canvas.addEventListener('mousedown', e => handleStart(e.clientX, e.clientY, false));
uiOverlay.addEventListener('mousedown', e => e.stopPropagation());

window.addEventListener('mousemove', e => handleMove(e.clientX, e.clientY, false));

window.addEventListener('mouseup', () => {
    if (view.dragging) finalizeInteraction();
});


canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const b = xy2latLon(e.clientX, e.clientY);

    let newHeight = view.latHeight * (e.deltaY > 0 ? 1.1 : 0.9);

    // Clamp to 3 meters vertical height
    const minHeight = 3 / 111120;
    updateLatScale(Math.max(newHeight, minHeight));

    const a = xy2latLon(e.clientX, e.clientY);
    view.lon += (b.lon - a.lon);
    view.lat += (b.lat - a.lat);
    updateVisibleData();
}, { passive: false });


// Function to handle opening the full-resolution image
const openFullImage = (e) => {
    e.stopPropagation();
    if (currentPreview) {
        window.open(currentPreview.path.replace(/\\/g, '/'), '_blank');
    }
};
previewImg.onclick = openFullImage;
previewImg.ontouchend = openFullImage;

window.addEventListener('keydown', (e) => {
    if (visibleImages.length === 0) return;

    let action = null;
    if (e.key === "ArrowRight") action = 1;
    else if (e.key === "ArrowLeft") action = -1;
    else if (e.key === "Home") action = "first";
    else if (e.key === "End") action = "last";

    if (action !== null) {
        const currentIndex = visibleImages.indexOf(selectedImage);

        // getNavIndex handles the logic if currentIndex is -1 (nothing selected)
        const nextIndex = chronological.getNavIndex(currentIndex, action);

        if (nextIndex !== null && nextIndex !== currentIndex) {
            selectedImage = visibleImages[nextIndex];
            updateOverlay(selectedImage);
            draw();
        }
    }
});

function handleWindowResize()
{
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    updateVisibleData();
}

window.addEventListener('resize', handleWindowResize)

initData();
handleWindowResize(); // Get initial size.
</script>
</body>
</html>
