<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GPS Image Mapper</title>
    <script src="gpstagged.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        canvas { display: block; cursor: default; }

        #ui-overlay {
            position: absolute; top: 10px; right: 10px; width: 320px;
            background: rgba(255, 255, 255, 0.95); padding: 12px;
            border-radius: 8px; display: none;
            pointer-events: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); border: 1px solid #ccc;
            z-index: 1000;
        }
        #preview-img { width: 320px; height: 240px; object-fit: contain; background: #111; border-radius: 4px; cursor: pointer; }
        #info-text { margin-top: 10px; font-size: 13px; color: #111; line-height: 1.5; white-space: pre-wrap; }
        .link-text { cursor: pointer; color: #0056b3; text-decoration: underline; padding: 2px 0; display: inline-block; }
    </style>
</head>
<body>

<div id="ui-overlay">
    <img id="preview-img" alt="Preview">
    <div id="info-text"></div>
</div>

<canvas id="mapCanvas"></canvas>


<div id="ui-overlay">...</div>

<a id="map-link" target="_blank" style="
    position: absolute; top: 18px; left: 0;
    background: #00a000; color: white;
    padding: 2px 8px; border-radius: 2px;
    text-decoration: none; font-family: sans-serif;
    font-size: 14px; border: 1px solid white;
    z-index: 500; display: none;
">Map</a>

<canvas id="mapCanvas"></canvas>

<script>
const canvas = document.getElementById('mapCanvas');
const ctx = canvas.getContext('2d');
const uiOverlay = document.getElementById('ui-overlay');
const previewImg = document.getElementById('preview-img');
const infoText = document.getElementById('info-text');

let images = [];
let visibleImages = [];
let clusters = [];
let selectedImage = null;
let currentPreview = null;

// --- PERSISTENCE & URL LOGIC ---
function getInitialView() {
    // Get the part after the '?' (e.g., "@46.122053,-69.532545,437068m")
    const searchString = window.location.search;

    // Regex matches @lat,lon and optionally ,widthm
    const match = searchString.match(/@([\d.-]+),([\d.-]+)(?:,(\d+)m)?/);

    if (match) {
        const lat = parseFloat(match[1]);
        const lon = parseFloat(match[2]);
        // Default to 1000m if width is missing from the URL
        const widthMeters = match[3] ? parseFloat(match[3]) : 1000;

        // Convert meters back to lonWidth
        const latRad = lat * Math.PI / 180;
        const metersPerDegreeLon = 111120 * Math.cos(latRad);
        const lonWidth = widthMeters / (0.7 * metersPerDegreeLon);

        return { lat, lon, lonWidth };
    }

    // Fallback to localStorage or defaults if URL has no bookmark
    return JSON.parse(localStorage.getItem('mapView')) || {
        lat: 45.624897, lon: -75.239783, lonWidth: 12
    };
}

let view = {
    ...getInitialView(),
    dragging: false,
    dragStart: { x: 0, y: 0 },
    dragOffset: { x: 0, y: 0 }
};

function saveView() {
    // Calculate width in meters
    const latRad = view.lat * Math.PI / 180;
    const metersPerDegreeLon = 111120 * Math.cos(latRad);
    const widthInMeters = Math.round(view.lonWidth * 0.7 * metersPerDegreeLon);

    // Update localStorage for persistence
    localStorage.setItem('mapView', JSON.stringify({
        lat: view.lat,
        lon: view.lon,
        lonWidth: view.lonWidth
    }));

    let locValue = `@${view.lat.toFixed(6)},${view.lon.toFixed(6)},${widthInMeters}m`;
    const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname +"?"+ locValue;
    history.replaceState(null, '', newUrl);

    // Update the physical <a> tag
    const mapLink = document.getElementById('map-link');
    if (mapLink) {
        mapLink.href = `https://www.google.com/maps/${locValue}`;
    }
}

// --- DATA LOADING ---
function initData() {
    // Alert the user if gpstagged.js (containing rawImageData) is missing
    if (typeof rawImageData !== 'undefined') {
        parseData(rawImageData);
        updateVisibleData();
    } else {
        alert("gpstagged.js not found or rawImageData not created.");
    }
}

function parseData(text) {
    const lines = text.trim().split(/\r?\n/);
    images = [];
    for (let i = 0; i < lines.length; i++) {
        let path = lines[i].trim();
        // Skip JS wrapper lines if they are included in the string
        if (!path || path.startsWith("const") || path.endsWith("`;")) continue;
        let dtl = (lines[++i] || "").replace('Date/Time: ', '').trim();
        let gl = (lines[++i] || "");
        let cl = (lines[++i] || "").replace('Camera: ', '').trim();
        const m = gl.match(/GPS:\s*([\d.-]+),\s*([\d.-]+)/);
        if (m) images.push({ path, dateTime: dtl, lat: parseFloat(m[1]), lon: parseFloat(m[2]), camera: cl || "Unknown" });
    }
    images.sort((a, b) => a.lon - b.lon || a.lat - b.lat || a.dateTime - b.dateTime ||  a.camera - b.camera);
}



// --- DRAWING & CLUSTERING ---
function project(lat, lon) {
    const scale = (canvas.width / view.lonWidth);
    return { x: (lon - view.lon) * 0.7 * scale + (canvas.width / 2), y: canvas.height / 2 - (lat - view.lat) * scale };
}

function unproject(x, y) {
    const scale = (canvas.width / view.lonWidth);
    return { lon: (x - (canvas.width / 2)) / (0.7 * scale) + view.lon, lat: view.lat - (y - (canvas.height / 2)) / scale };
}

function findFirstLongitudeIndex(targetLon)
{   // Does a binary search on the while image list to find a particular latitude.
    let low = 0;
    let high = images.length;
    while (low < high) {
        let mid = (low + high) >>> 1;
        if (images[mid].lon < targetLon) low = mid + 1;
        else high = mid;
    }
    return low;
}

function updateVisibleData() {
    saveView();
    if (images.length === 0) return;
    const b1 = unproject(-20, -20);
    const b2 = unproject(canvas.width + 20, canvas.height + 20);

    const maxLat = b1.lat;
    const minLat = b2.lat;
    const minLon = b1.lon;
    const maxLon = b2.lon;

    // Longitude range to filter by
    const startIndex = findFirstLongitudeIndex(minLon)
    const endIndex = findFirstLongitudeIndex(maxLon)
    if (endIndex < images.len) endIndex += 1

    visibleImages = [];
    for (let i = startIndex; i < endIndex; i++) {
        const img = images[i];
        // Filter by Latutude (already have looping over right longitude range)
        if (img.lat >= minLat && img.lat <= maxLat) {
            visibleImages.push(img);
        }
    }
    console.log(`Slice: ${endIndex - startIndex} show: ${visibleImages.length}`);

    const latRad = view.lat * Math.PI / 180;
    const metersPerDegreeLon = 111120 * Math.cos(latRad);
    const pixelsPerDegreeLon = (canvas.width / view.lonWidth) * 0.7;
    const pixelsPerMeter = pixelsPerDegreeLon / metersPerDegreeLon;

    const useJitter = pixelsPerMeter > 60;

    const spacing = 0.0000004;
    let  prevLat = 0
    let  prevLon = 0
    let  onCount = 0

    visibleImages.forEach(img => {
        img.dispLat = img.lat; // Coordinates to use for display
        img.dispLon = img.lon;

        if (useJitter){
            if  (prevLon == img.lon && prevLat == img.lat){
                // If it coincides with other images, spread them out over a 7x7 grid.
                // don't repeat positions until after 49 of them.
                onCount = (onCount+23) % 49
                img.dispLat += (Math.trunc(onCount/7)-3) * spacing;
                img.dispLon += (onCount%7 -3) * spacing*2;

            }else{
                console.log("---")
                prevLat = img.lat
                prevLon = img.lon
                onCount = 24
            }
        }
    })


    clusters = [];
    const baseRadius = 3;
    visibleImages.forEach(img => {
        const pos = project(img.dispLat, img.dispLon);
        let merged = false;

        if (!useJitter){
            for (let i = clusters.length - 1; i >= 0; i--) {
                const c = clusters[i];
                if (pos.x - c.x > 50){
                    // Clusters end up naturally longitude sorted.  Looking further left
                    // won't find a cluster to combine with
                    break;
                }
                const d = Math.sqrt((pos.x - c.x)**2 + (pos.y - c.y)**2);
                if (d < c.radius*1.1) {
                    const w = c.count + 1;
                    c.lat = (c.lat * c.count + img.dispLat) / w;
                    c.lon = (c.lon * c.count + img.dispLon) / w;
                    const nPos = project(c.lat, c.lon);
                    c.x = nPos.x; c.y = nPos.y;
                    c.count++;
                    c.radius = c.count > 3 ? baseRadius * Math.pow(c.count / 3, 1/3) : baseRadius;
                    merged = true; break;
                }
            }
        }

        if (!merged) clusters.push({ x: pos.x, y: pos.y, lat: img.lat, lon: img.lon, count: 1, radius: baseRadius });
    });

    // If a closter has grown large enough, it might have swallwed previous clusters to its left
    // that were created before the cluster grew that big.  Iterate right to left
    // to see if large clusters swallo smaller clusters and absorb them.
    if (!useJitter) {
        for (let i = clusters.length - 1; i >= 0; i--) {
            const cMain = clusters[i];

            // Check clusters to the left of cMain
            for (let j = i - 1; j >= 0; j--) {
                const cLeft = clusters[j];

                // Since they are longitude sorted, if the X distance is
                // greater than the combined radii, we can stop looking left.
                if (cMain.x - cLeft.x > (cMain.radius + cLeft.radius) * 1.5) break;

                const d = Math.sqrt((cMain.x - cLeft.x)**2 + (cMain.y - cLeft.y)**2);

                // If they overlap (using a 1.1x multiplier for a cleaner look)
                if (d < (cMain.radius + cLeft.radius) * 0.8) {
                    const totalCount = cMain.count + cLeft.count;

                    // Weighted average for new position
                    cMain.lat = (cMain.lat * cMain.count + cLeft.lat * cLeft.count) / totalCount;
                    cMain.lon = (cMain.lon * cMain.count + cLeft.lon * cLeft.count) / totalCount;

                    const nPos = project(cMain.lat, cMain.lon);
                    cMain.x = nPos.x;
                    cMain.y = nPos.y;
                    cMain.count = totalCount;

                    // Recalculate radius based on new count
                    cMain.radius = cMain.count > 3 ? baseRadius * Math.pow(cMain.count / 3, 1/3) : baseRadius;

                    clusters.splice(j, 1); // Remove the merged cluster from the left

                    i--;  // Adjust 'i' because the array just got shorter
                }
            }
        }
    }

    draw();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.translate(view.dragOffset.x, view.dragOffset.y);

    clusters.forEach(c => {
        let alpha = 0.45;
        if (c.count === 2) alpha = 0.63;
        if (c.count >= 3) alpha = 0.77;

        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = `rgba(30, 144, 255, ${alpha})`;
        ctx.beginPath(); ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = `rgba(255, 255, 255, 0.08)`; ctx.fill();
    });

    if (currentPreview) {
        ctx.globalCompositeOperation = 'source-over';
        const p = project(currentPreview.dispLat, currentPreview.dispLon);
        if (currentPreview === selectedImage) {
            ctx.strokeStyle = 'red'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(p.x, p.y, 9, 0, Math.PI * 2); ctx.stroke();
        }
        ctx.fillStyle = 'red'; ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    drawScaleBar(visibleImages.length);
}

// Global to store the map button bounds and current view width
let mapButtonRect = { x: 0, y: 0, w: 0, h: 0 };
let currentWidthMeters = 1000;

function drawScaleBar(count) {
    const latRad = view.lat * Math.PI / 180;
    const metersPerDegreeLon = 111120 * Math.cos(latRad);
    const pixelsPerDegreeLon = (canvas.width / view.lonWidth) * 0.7;
    const metersPerPixel = metersPerDegreeLon / pixelsPerDegreeLon;

    // Total width of the view in meters
    currentWidthMeters = Math.round(canvas.width * metersPerPixel);

    const maxBarWidth = 300;
    const maxMeters = maxBarWidth * metersPerPixel;
    const steps = [1, 2, 5];
    let mag = Math.pow(10, Math.floor(Math.log10(maxMeters)));
    let bestMeters = 0;
    for (let i = 2; i >= 0; i--) {
        let test = steps[i] * mag;
        if (test <= maxMeters) { bestMeters = test; break; }
    }
    if (bestMeters === 0) bestMeters = mag / 2;
    const barWidth = bestMeters / metersPerPixel;
    const label = bestMeters >= 1000 ? (bestMeters / 1000) + " km" : bestMeters + " m";

    const x = 20, y = 30;
    ctx.save(); ctx.resetTransform();

    // Draw Scale Line
    ctx.strokeStyle = "white"; ctx.fillStyle = "white"; ctx.lineWidth = 2; ctx.font = "bold 14px sans-serif";
    ctx.beginPath(); ctx.moveTo(x, y-5); ctx.lineTo(x, y+5); ctx.moveTo(x, y); ctx.lineTo(x+barWidth, y); ctx.moveTo(x+barWidth, y-5); ctx.lineTo(x+barWidth, y+5); ctx.stroke();
    ctx.textAlign = "center"; ctx.fillText(label, x + (barWidth / 2), y - 10);
    ctx.textAlign = "left"; ctx.font = "13px sans-serif"; ctx.fillText(`in view: ${count.toLocaleString()} images`, x, y + 25);

    // Position the HTML anchor tag dynamically
    const mapLink = document.getElementById('map-link');
    if (mapLink) {
        const btnX = x + barWidth + 20;
        mapLink.style.left = btnX + "px";
        mapLink.style.display = 'block'; // Show it once calculated
    }

    ctx.restore();
}
function getThumbPath(fullPath) {
    let p = fullPath.replace(/\\/g, '/');
    let parts = p.split('/');
    let fn = parts.pop();
    return parts.length > 0 ? `${parts.join('/')}/_small/${fn}` : `_small/${fn}`;
}

function updateOverlay(img) {
    if (!img) return;
    currentPreview = img;
    uiOverlay.style.display = 'block';
    previewImg.src = getThumbPath(img.path);
    infoText.innerHTML = '';
    const addLink = (txt, action) => {
        const s = document.createElement('div'); s.className = 'link-text'; s.textContent = txt;
        s.onclick = e => { e.stopPropagation(); action(); };
        s.ontouchend = e => { e.stopPropagation(); e.preventDefault(); action(); };
        infoText.appendChild(s);
    };
    addLink(img.path, () => {
        const p = img.path.replace(/\\/g, '/');
        window.open(p.substring(0, p.lastIndexOf('/')) + '/index.html', '_blank');
    });
    infoText.appendChild(document.createTextNode(`\n${img.dateTime}\n`));
    addLink(`GPS: ${img.lat.toFixed(6)}, ${img.lon.toFixed(6)}`, () => {
        window.open(`https://www.google.com/maps?q=${img.lat},${img.lon}`, '_blank');
    });
    infoText.appendChild(document.createTextNode(`\nCamera: ${img.camera}`));
}


// Prevent default to allow drop
window.addEventListener('dragover', e => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
});

window.addEventListener('drop', e => {
    e.preventDefault();

    // Get the dropped data (usually a URL)
    const droppedData = e.dataTransfer.getData('text/plain');
    if (!droppedData) return;

    // Use a regex to find the @lat,lon,zoom or @lat,lon,widthm pattern
    // This handles both Google Maps URLs and your own format
    const match = droppedData.match(/@([\d.-]+),([\d.-]+)(?:,([\d.]+)([mz]))?/);

    if (!match) return;
    const lat = parseFloat(match[1]);
    const lon = parseFloat(match[2]);
    const widthMeters = match[3] ? parseFloat(match[3]) : 1000;

    // Apply to the view
    view.lat = lat;
    view.lon = lon;

    // Convert width back to your internal lonWidth
    const latRad = lat * Math.PI / 180;
    const metersPerDegreeLon = 111120 * Math.cos(latRad);
    view.lonWidth = widthMeters / (0.7 * metersPerDegreeLon);

    updateVisibleData();     // Refresh the view

});

const handleStart = (x, y, isTouch) => {
    const r = uiOverlay.getBoundingClientRect();
    if (uiOverlay.style.display !== 'none' && x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return;

    const t = isTouch ? 30 : 10;
    const target = findNearestImage(x, y, t);

    if (target) {
        selectedImage = target;
        updateOverlay(target);
        view.dragging = false;
    } else {
        selectedImage = null;
        view.dragging = true;
        view.dragStart = { x, y };
        if (!findNearestImage(x, y, t)) uiOverlay.style.display = 'none';
        draw(); // Redraw to clear the red selection circle
    }
};
const handleMove = (x, y, isTouch) => {
    if (view.dragging) {
        view.dragOffset.x = x - view.dragStart.x;
        view.dragOffset.y = y - view.dragStart.y;
        draw();
    } else {
        // Search the already-filtered visible list for hovering
        const target = findNearestImage(x, y, isTouch ? 30 : 10);
        if (target) {
            updateOverlay(target);
        } else if (selectedImage) {
            // Snap back to selected image if not hovering anything else
            updateOverlay(selectedImage);
        }
        draw()
    }
};


const handleEnd = () => {
    if (view.dragging) {
        const s = (canvas.width / view.lonWidth);
        view.lon -= (view.dragOffset.x / (0.7 * s)); view.lat += (view.dragOffset.y / s);
        view.dragOffset = { x: 0, y: 0 }; view.dragging = false; updateVisibleData();
    }
};

canvas.addEventListener('mousedown', e => handleStart(e.clientX, e.clientY, false));
window.addEventListener('mousemove', e => handleMove(e.clientX, e.clientY, false));
window.addEventListener('mouseup', handleEnd);

let iD = 0, iS = 0;
canvas.addEventListener('touchstart', e => {
    if (e.touches.length === 1) handleStart(e.touches[0].clientX, e.touches[0].clientY, true);
    else if (e.touches.length === 2) {
        view.dragging = false;
        iD = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        iS = view.lonWidth;
    }
}, {passive: false});

canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (e.touches.length === 1) handleMove(e.touches[0].clientX, e.touches[0].clientY, true);
    else if (e.touches.length === 2) {
        const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        const mx = (e.touches[0].clientX + e.touches[1].clientX) / 2, my = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        const b = unproject(mx, my);
        view.lonWidth = iS * (iD / d);
        if (view.lonWidth < 0.00005) view.lonWidth = 0.00005
        const a = unproject(mx, my);
        view.lon += (b.lon - a.lon);
        view.lat += (b.lat - a.lat);
        updateVisibleData();
    }
}, {passive: false});
canvas.addEventListener('touchend', handleEnd);

canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const b = unproject(e.clientX, e.clientY);
    view.lonWidth *= (e.deltaY > 0 ? 1.1 : 0.9);
    if (view.lonWidth < 0.00005) view.lonWidth = 0.00005


    const a = unproject(e.clientX, e.clientY);
    view.lon += (b.lon - a.lon); view.lat += (b.lat - a.lat);
    updateVisibleData();
}, { passive: false });

// Optimized to search only images currently in view
function findNearestImage(x, y, threshold) {
    let nearest = null;
    let minDist = threshold;

    // Using visibleImages here makes mouse interactions much faster
    visibleImages.forEach(img => {
        const pos = project(img.dispLat, img.dispLon);

        const d = Math.sqrt((pos.x - x)**2 + (pos.y - y)**2);
        if (d < minDist) {
            minDist = d;
            nearest = img;
        }
    });
    return nearest;
}

uiOverlay.addEventListener('touchstart', e => e.stopPropagation());
uiOverlay.addEventListener('mousedown', e => e.stopPropagation());

// Function to handle opening the full-resolution image
const openFullImage = (e) => {
    e.stopPropagation();
    if (currentPreview) {
        window.open(currentPreview.path.replace(/\\/g, '/'), '_blank');
    }
};
previewImg.onclick = openFullImage;
previewImg.ontouchend = openFullImage;


window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; updateVisibleData(); });
canvas.width = window.innerWidth; canvas.height = window.innerHeight;

// Standard browser initialization
initData();
//function animate() { draw(); requestAnimationFrame(animate); }
//animate();
</script>
</body>
</html>
