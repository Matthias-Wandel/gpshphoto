<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GPS Image Mapper</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        /* Use default arrow cursor instead of hand */
        canvas { display: block; cursor: default; }
        
        #ui-overlay {
            position: absolute; top: 10px; right: 10px; width: 400px;
            background: rgba(255, 255, 255, 0.95); padding: 12px;
            border-radius: 8px; display: none; 
            pointer-events: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); border: 1px solid #ccc;
            z-index: 100;
            cursor: pointer; /* Pointer only on the UI box to show it's clickable */
        }
        /* Changed object-fit to contain to show full image without cropping */
        #preview-img { width: 400px; height: 300px; object-fit: contain; background: #111; border-radius: 4px; }
        
        #info-text { margin-top: 10px; font-size: 13px; color: #111; line-height: 1.5; white-space: pre-wrap; }
        .link-text { cursor: pointer; color: #0056b3; text-decoration: underline; margin-bottom: 2px; }
        .link-text:hover { color: #0078d7; }
        #ui-overlay {
            position: absolute; top: 10px; right: 10px; width: 400px;
            background: rgba(255, 255, 255, 0.95); padding: 12px;
            border-radius: 8px; display: none; 
            pointer-events: auto; /* Crucial for iPad clicks */
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); border: 1px solid #ccc;
            z-index: 1000; /* Sit above the canvas */
        }
        .link-text { 
            cursor: pointer; color: #0056b3; text-decoration: underline; 
            margin-bottom: 2px; padding: 4px 0; display: inline-block; 
        }
    </style>
    
</head>
<body>

<div id="ui-overlay">
    <img id="preview-img" alt="Preview">
    <div id="info-text"></div>
</div>

<canvas id="mapCanvas"></canvas>

<script>
const canvas = document.getElementById('mapCanvas');
const ctx = canvas.getContext('2d');
const uiOverlay = document.getElementById('ui-overlay');
const previewImg = document.getElementById('preview-img');
const infoText = document.getElementById('info-text');

let images = [];
let visibleImages = [];
let clusters = [];
let selectedImage = null;
let currentPreview = null; // The image currently shown in the overlay

let view = {
    lat: 45.624897, lon: -75.239783, lonWidth: 12,
    dragging: false, dragStart: { x: 0, y: 0 }, dragOffset: { x: 0, y: 0 }
};

window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    updateVisibleData();
});
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

fetch('gpstagged.txt')
    .then(r => r.text())
    .then(text => {
        parseData(text);
        updateVisibleData();
    });

function parseData(text) {
    const lines = text.split(/\r?\n/);
    images = [];
    for (let i = 0; i < lines.length; i++) {
        let path = lines[i].trim();
        if (!path) continue;
        let dateTimeLine = (lines[++i] || "").replace('Date/Time: ', '').trim();
        let gpsLine = (lines[++i] || "");
        let cameraLine = (lines[++i] || "").replace('Camera: ', '').trim();
        const gpsMatch = gpsLine.match(/GPS:\s*([\d.-]+),\s*([\d.-]+)/);
        if (gpsMatch) {
            images.push({
                path: path, dateTime: dateTimeLine,
                lat: parseFloat(gpsMatch[1]), lon: parseFloat(gpsMatch[2]),
                camera: cameraLine || "Unknown"
            });
        }
    }
}

function project(lat, lon) {
    const scale = canvas.width / view.lonWidth;
    const x = (lon - view.lon) * 0.7 * scale + (canvas.width / 2);
    const y = canvas.height / 2 - (lat - view.lat) * scale;
    return { x, y };
}

function unproject(x, y) {
    const scale = canvas.width / view.lonWidth;
    const lon = (x - (canvas.width / 2)) / (0.7 * scale) + view.lon;
    const lat = view.lat - (y - (canvas.height / 2)) / scale;
    return { lat, lon };
}

function updateVisibleData() {
    if (images.length === 0) return;
    const topLeft = unproject(-20, -20);
    const bottomRight = unproject(canvas.width + 20, canvas.height + 20);
    const minLat = Math.min(topLeft.lat, bottomRight.lat);
    const maxLat = Math.max(topLeft.lat, bottomRight.lat);
    const minLon = Math.min(topLeft.lon, bottomRight.lon);
    const maxLon = Math.max(topLeft.lon, bottomRight.lon);

    visibleImages = images.filter(img => 
        img.lat >= minLat && img.lat <= maxLat && img.lon >= minLon && img.lon <= maxLon
    );

    clusters = [];
    const baseRadius = 3; 
    visibleImages.forEach(img => {
        const pos = project(img.lat, img.lon);
        let merged = false;
        for (let cluster of clusters) {
            const dx = pos.x - cluster.x;
            const dy = pos.y - cluster.y;
            if (Math.sqrt(dx*dx + dy*dy) < cluster.radius) {
                const weight = cluster.count + 1;
                cluster.lat = (cluster.lat * cluster.count + img.lat) / weight;
                cluster.lon = (cluster.lon * cluster.count + img.lon) / weight;
                const newPos = project(cluster.lat, cluster.lon);
                cluster.x = newPos.x; cluster.y = newPos.y;
                cluster.count++;
                cluster.radius = baseRadius * Math.pow(cluster.count, 1/3);
                merged = true;
                break;
            }
        }
        if (!merged) {
            clusters.push({ x: pos.x, y: pos.y, lat: img.lat, lon: img.lon, count: 1, radius: baseRadius });
        }
    });
    draw();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.translate(view.dragOffset.x, view.dragOffset.y);
    
    // 1. Draw Clusters
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(30, 144, 255, 0.65)';
    clusters.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.fill();
        ctx.fillStyle = 'rgba(30, 144, 255, 0.65)';
    });

    // 2. Draw Highlight for current preview
    if (currentPreview) {
        ctx.globalCompositeOperation = 'source-over';
        const pos = project(currentPreview.lat, currentPreview.lon);
        
        // If this is the "LOCKED" image, make it pulse or draw a ring
        if (currentPreview === selectedImage) {
            const pulse = (Math.sin(Date.now() / 200) + 1) * 2; // Pulsing effect
            ctx.strokeStyle = 'red';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, 5 + pulse, 0, Math.PI * 2);
            ctx.stroke();
        }

        ctx.fillStyle = 'red';
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, 3, 0, Math.PI * 2);
        ctx.fill();
    }
    
    ctx.restore();
    drawScaleBar();
}

// Keep the pulse moving
function animate() {
    if (selectedImage) draw();
    requestAnimationFrame(animate);
}
animate();
function drawScaleBar() {
    const latRad = view.lat * Math.PI / 180;
    const metersPerDegreeLon = 111120 * Math.cos(latRad);
    const pixelsPerDegreeLon = (canvas.width / view.lonWidth) * 0.7;
    const metersPerPixel = metersPerDegreeLon / pixelsPerDegreeLon;

    const maxBarWidth = 300;
    const maxMeters = maxBarWidth * metersPerPixel;
    const steps = [1, 2, 5];
    let magnitude = Math.pow(10, Math.floor(Math.log10(maxMeters)));
    let bestMeters = 0;

    for (let i = steps.length - 1; i >= 0; i--) {
        let test = steps[i] * magnitude;
        if (test <= maxMeters) { bestMeters = test; break; }
    }
    if (bestMeters === 0) bestMeters = magnitude / 2;

    const barWidth = bestMeters / metersPerPixel;
    const label = bestMeters >= 1000 ? (bestMeters / 1000) + " km" : bestMeters + " m";

    const x = 20, y = 30;
    ctx.save();
    ctx.resetTransform();
    ctx.strokeStyle = "white";
    ctx.fillStyle = "white";
    ctx.lineWidth = 2;
    ctx.font = "bold 14px sans-serif";
    ctx.textAlign = "center";
    ctx.beginPath();
    ctx.moveTo(x, y - 5); ctx.lineTo(x, y + 5);
    ctx.moveTo(x, y); ctx.lineTo(x + barWidth, y);
    ctx.moveTo(x + barWidth, y - 5); ctx.lineTo(x + barWidth, y + 5);
    ctx.stroke();
    ctx.fillText(label, x + (barWidth / 2), y - 10);
    ctx.restore();
}

function getThumbPath(fullPath) {
    const parts = fullPath.replace(/\\/g, '/').split('/');
    const filename = parts.pop();
    return `${parts.join('/')}/_small/${filename}`;
}

// Prevent the iPad from "clicking through" the UI to the map
uiOverlay.addEventListener('touchstart', (e) => e.stopPropagation(), {passive: false});
uiOverlay.addEventListener('mousedown', (e) => e.stopPropagation());

function updateOverlay(img) {
    if (!img) return;
    currentPreview = img;
    uiOverlay.style.display = 'block';
    previewImg.src = getThumbPath(img.path);
    
    infoText.innerHTML = '';
    
    // Directory Link
    const pathSpan = document.createElement('div');
    pathSpan.className = 'link-text';
    pathSpan.textContent = img.path;
    const openDir = (e) => {
        e.stopPropagation();
        const p = img.path.replace(/\\/g, '/');
        window.open(p.substring(0, p.lastIndexOf('/')) + '/index.html', '_blank');
    };
    pathSpan.onclick = openDir;
    pathSpan.ontouchend = openDir; // Fast-fire for mobile

    // GPS/Map Link
    const gpsSpan = document.createElement('div');
    gpsSpan.className = 'link-text';
    gpsSpan.textContent = `GPS: ${img.lat.toFixed(6)}, ${img.lon.toFixed(6)}`;
    const openMap = (e) => {
        e.stopPropagation();
        window.open(`https://www.google.com/maps?q=${img.lat},${img.lon}`, '_blank');
    };
    gpsSpan.onclick = openMap;
    gpsSpan.ontouchend = openMap;

    infoText.appendChild(pathSpan);
    infoText.appendChild(document.createTextNode(`\n${img.dateTime}\n`));
    infoText.appendChild(gpsSpan);
    infoText.appendChild(document.createTextNode(`\nCamera: ${img.camera}`));
    
    draw(); 
}

// Entire overlay is clickable for full image
uiOverlay.onclick = () => {
    if (currentPreview) window.open(currentPreview.path.replace(/\\/g, '/'), '_blank');
};

// --- INPUT LOGIC ---

// Fixed Image Click for Mobile
const openFullImg = (e) => {
    if (!currentPreview) return;
    e.stopPropagation();
    window.open(currentPreview.path.replace(/\\/g, '/'), '_blank');
};
previewImg.onclick = openFullImg;
previewImg.ontouchend = openFullImg;

// --- Update handleStart to ignore UI touches ---
const handleStart = (x, y, isTouch) => {
    // If the click/touch is inside the UI box, do nothing here
    const rect = uiOverlay.getBoundingClientRect();
    if (uiOverlay.style.display !== 'none' && 
        x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
        return; 
    }

    const threshold = isTouch ? 30 : 10;
    const target = findNearestImage(x, y, threshold);
    
    if (target) {
        selectedImage = target;
        updateOverlay(selectedImage);
        view.dragging = false;
    } else {
        selectedImage = null;
        view.dragging = true;
        view.dragStart = { x, y };
        const hoverTarget = findNearestImage(x, y, threshold);
        if (!hoverTarget) uiOverlay.style.display = 'none';
    }
};

const handleMove = (x, y, isTouch) => {
    if (view.dragging) {
        view.dragOffset.x = x - view.dragStart.x;
        view.dragOffset.y = y - view.dragStart.y;
        draw();
    } else {
        const hoverTarget = findNearestImage(x, y, isTouch ? 30 : 10);
        
        if (hoverTarget) {
            // Browsing: show what's under the cursor
            updateOverlay(hoverTarget);
        } else if (selectedImage) {
            // Snap back to the LOCKED image if we move into empty space
            updateOverlay(selectedImage);
        } else {
            // Nothing selected and nothing hovered
            uiOverlay.style.display = 'none';
            currentPreview = null;
            draw();
        }
    }
};
const handleEnd = () => {
    if (view.dragging) {
        const scale = canvas.width / view.lonWidth;
        view.lon -= (view.dragOffset.x / (0.7 * scale));
        view.lat += (view.dragOffset.y / scale);
        view.dragOffset = { x: 0, y: 0 };
        view.dragging = false;
        updateVisibleData();
    }
};

// Desktop Events
canvas.addEventListener('mousedown', e => handleStart(e.clientX, e.clientY, false));
window.addEventListener('mousemove', e => handleMove(e.clientX, e.clientY, false));
window.addEventListener('mouseup', handleEnd);

// Touch support
let initialDist = 0;
let initialScale = 0;

canvas.addEventListener('touchstart', e => {
    if (e.touches.length === 1) {
        handleStart(e.touches[0].clientX, e.touches[0].clientY, true);
    } else if (e.touches.length === 2) {
        view.dragging = false;
        initialDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        initialScale = view.lonWidth;
    }
}, {passive: false});

canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (e.touches.length === 1) {
        handleMove(e.touches[0].clientX, e.touches[0].clientY, true);
    } else if (e.touches.length === 2) {
        const currentDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        const b = unproject(midX, midY);
        view.lonWidth = initialScale * (initialDist / currentDist);
        const a = unproject(midX, midY);
        view.lon += (b.lon - a.lon); view.lat += (b.lat - a.lat);
        updateVisibleData();
    }
}, {passive: false});

canvas.addEventListener('touchend', handleEnd);

// Wheel Zoom
canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const b = unproject(e.clientX, e.clientY);
    view.lonWidth *= (e.deltaY > 0 ? 1.1 : 0.9);
    const a = unproject(e.clientX, e.clientY);
    view.lon += (b.lon - a.lon); view.lat += (b.lat - a.lat);
    updateVisibleData();
}, { passive: false });

function findNearestImage(x, y, threshold) {
    let nearest = null; let minDist = threshold;
    visibleImages.forEach(img => {
        const pos = project(img.lat, img.lon);
        const d = Math.sqrt((pos.x - x)**2 + (pos.y - y)**2);
        if (d < minDist) { minDist = d; nearest = img; }
    });
    return nearest;
}

</script>
</body>
</html>
